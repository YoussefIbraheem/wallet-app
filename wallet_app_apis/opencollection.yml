opencollection: 1.0.0

info:
  name: wallet_app
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: localhost
      value: 127.0.0.1:8000/api
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
